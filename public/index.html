<!doctype html>
<html lang="en">

<style>
:root{--bg:#07111f;--card:#111e33;--card2:#172842;--text:#fff;--muted:#9db0ca;--accent:#57c8ff;--red:#ff5d73;--green:#63e6a3;--yellow:#ffd66b;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#10203a,#07111f);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.app{width:min(920px,100%);margin:auto}h1{text-align:center;font-size:clamp(32px,7vw,58px);line-height:1;margin:7px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:13px}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:850;color:var(--muted);margin-bottom:10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{min-height:66px;background:var(--card2);border:1px solid var(--line);border-radius:15px;color:#fff;font-weight:850;font-size:14px;padding:8px;position:relative}.mode.active{border-color:var(--accent);background:rgba(87,200,255,.14);box-shadow:0 0 0 1px rgba(87,200,255,.12) inset}.mode b{display:block;font-size:22px}.delete-mini{position:absolute;right:5px;top:5px;width:25px;height:25px;border:0;border-radius:50%;background:rgba(255,255,255,.10);color:#fff;font-size:14px}.micarea{text-align:center}.micwrap{width:150px;height:150px;margin:auto;display:grid;place-items:center;position:relative}.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(87,200,255,.2)}.mic{position:relative;z-index:2;width:104px;height:104px;border:0;border-radius:50%;font-size:42px;background:var(--accent);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.listening .mic{background:var(--red);color:#fff}.listening .ring{border-color:var(--red);animation:pulse 1.05s infinite}@keyframes pulse{to{transform:scale(1.25);opacity:0}}.status{text-align:center;color:var(--muted);font-size:14px;min-height:22px;margin-top:4px}.progress{height:8px;background:#0b1729;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px auto 0;max-width:420px}.progress>div{height:100%;width:0;background:var(--accent);transition:width .32s ease}.hidden{display:none!important}textarea,input[type="text"]{width:100%;background:#0b1729;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:17px}textarea{min-height:100px;resize:vertical}.btn{width:100%;min-height:49px;border:0;border-radius:13px;background:var(--accent);font-weight:900;font-size:16px;margin-top:9px;cursor:pointer}.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result{font-weight:900;font-size:clamp(26px,6vw,42px);line-height:1.18;overflow-wrap:anywhere}.heard{color:var(--muted);font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}.pill{display:inline-block;background:rgba(87,200,255,.1);color:#bfeaff;border:1px solid rgba(87,200,255,.2);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:850;margin-bottom:8px}.confidence{color:var(--green);font-weight:850;font-size:13px;margin-top:8px}.warn{color:var(--yellow)}.details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.details summary{cursor:pointer;color:var(--muted);font-weight:800}.candidate{background:#0b1729;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.candidate small{display:block;color:var(--muted);margin-top:3px}.crack-card{border-color:rgba(99,230,163,.25)}.rulebox{background:#0b1729;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.rule-title{font-weight:900;margin-bottom:5px}.note{color:var(--muted);font-size:13px;line-height:1.45}.selftest{display:none;color:#ffb7c1;font-size:12px;text-align:center;margin:5px 0}
@media(max-width:520px){.modes{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px),(max-height:430px) and (max-width:500px){body{padding:6px}h1{font-size:21px;margin:3px 0 8px}.card{border-radius:14px;padding:8px;margin-bottom:6px}.label{font-size:9px;margin-bottom:5px}.modes{grid-template-columns:repeat(2,1fr);gap:4px}.mode{min-height:44px;font-size:10px;border-radius:10px;padding:3px}.mode b{font-size:15px}.delete-mini{width:19px;height:19px;font-size:10px}.micwrap{width:86px;height:86px}.mic{width:60px;height:60px;font-size:25px}.status{font-size:10px}.progress{height:5px}.btn{min-height:38px;font-size:12px;margin-top:5px}.result{font-size:19px}.heard{font-size:11px}.pill{font-size:8px;padding:3px 6px}.row{grid-template-columns:1fr}textarea{min-height:58px;font-size:13px;padding:7px}.details{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<h1>Secret Translator</h1>
<div id="selftest" class="selftest"></div>
<section class="card"><div class="label">Language</div><div class="modes" id="modes">
<button class="mode active" data-mode="ob"><b>🅾️</b>Ob</button>
<button class="mode" data-mode="pig"><b>🐷</b>Pig Latin</button>
<button class="mode" data-mode="ubbi"><b>🔵</b>Ubbi</button>
<button class="mode" data-mode="rovar"><b>🕵️</b>Rövar</button>
<button class="mode" data-mode="crack"><b>🧩</b>Crack New</button>
</div></section>
<section class="card crack-card hidden" id="crackPanel"><div class="label">Crack a new language</div><textarea id="crackInput" placeholder="Record or type several examples. Letters, numbers, and mixed codes all work."></textarea><button class="btn" id="crackBtn">Analyze & Create Language</button></section>
<section class="card micarea" id="micarea"><div class="micwrap"><div class="ring"></div><button class="mic" id="mic" aria-label="Record">🎤</button></div><div class="status" id="status"></div><div class="progress hidden" id="progress"><div id="progressBar"></div></div></section>
<section class="card"><div class="label">What it heard</div><textarea id="input" placeholder="Tap the microphone above, or type here"></textarea><div class="row"><button class="btn" id="translate">Translate</button><button class="btn secondary" id="clear">Clear</button></div></section>
<section class="card"><div class="pill" id="pill">WAITING</div><div class="label">English translation</div><div class="result" id="result">—</div><div class="confidence" id="confidence"></div><details class="details hidden" id="details"><summary>Recognition details</summary><div id="candidates"></div></details></section>
<section class="card"><div class="label">What it heard</div><div class="heard" id="heard">Nothing yet.</div></section>
<section class="card hidden" id="customInfoCard"><div class="label">Cracked language</div><div class="rulebox"><div class="rule-title" id="customRuleTitle"></div><div class="confidence" id="customConfidence"></div><div class="note" id="customDetails"></div></div><button class="btn secondary" id="addInfoBtn">+ Add Info</button><div id="addInfoPanel" class="hidden"><textarea id="addInfoInput" placeholder="Add more examples so this cracked language can improve."></textarea><button class="btn" id="improveBtn">Use New Info</button></div></section>
</main>


<script type="module">
const $=id=>document.getElementById(id);
const input=$('input'),result=$('result'),heard=$('heard'),statusEl=$('status'),pill=$('pill'),
confidenceEl=$('confidence'),mic=$('mic'),micarea=$('micarea'),progress=$('progress'),
progressBar=$('progressBar'),modesEl=$('modes'),crackPanel=$('crackPanel'),
crackInput=$('crackInput'),crackBtn=$('crackBtn'),customInfoCard=$('customInfoCard'),
customRuleTitle=$('customRuleTitle'),customConfidence=$('customConfidence'),
customDetails=$('customDetails'),addInfoBtn=$('addInfoBtn'),addInfoPanel=$('addInfoPanel'),
addInfoInput=$('addInfoInput'),improveBtn=$('improveBtn'),details=$('details'),candidatesEl=$('candidates');

let selectedMode='ob',listening=false,processing=false,recognitionTarget=input;
let audioContext=null,micStream=null,micSource=null,processor=null,silenceGain=null;
let pcmChunks=[],recordingSampleRate=48000,ignoreClick=false;
let progressValue=0,hideTimer=null;
let HF=null,literalPipe=null,literalLoading=null,whisperPipe=null,whisperLoading=null;

const MODE_NAMES={ob:'Ob',pig:'Pig Latin',ubbi:'Ubbi Dubbi',rovar:'Rövarspråket',crack:'Crack New'};
const V='aeiouy';

// ---------- progress ----------
function resetProgress(){
  if(hideTimer){clearTimeout(hideTimer);hideTimer=null}
  progressValue=0;
  progressBar.style.width='0%';
  progress.classList.add('hidden');
}
function setProgress(v){
  progressValue=Math.max(progressValue,Math.min(98,Number(v)||0));
  progress.classList.remove('hidden');
  progressBar.style.width=progressValue.toFixed(1)+'%';
}
function finishProgress(){
  progressValue=100;
  progress.classList.remove('hidden');
  progressBar.style.width='100%';
  hideTimer=setTimeout(()=>{
    progress.classList.add('hidden');
    progressBar.style.width='0%';
    progressValue=0;
  },500);
}

// ---------- language rules ----------
function preserveCase(original,replacement){
  if(!replacement)return'';
  if(original===original.toUpperCase())return replacement.toUpperCase();
  if(original[0]&&original[0]===original[0].toUpperCase())
    return replacement[0].toUpperCase()+replacement.slice(1).toLowerCase();
  return replacement.toLowerCase();
}
function mapWords(text,fn){
  return String(text||'').replace(/[A-Za-zÀ-ÖØ-öø-ÿ']+/g,fn);
}
function encodeOb(text){
  return mapWords(text,w=>{
    let o='';
    for(const ch of w){if(V.includes(ch.toLowerCase()))o+='ob';o+=ch}
    return o;
  });
}
function decodeObWord(w){
  const original=w;
  let d=w.toLowerCase();

  // Main rule: remove the Ob syllable immediately before a vowel.
  // The relaxed variants help when the literal recognizer hears "ob" as
  // "awb", "ahb", "ub", or "op".
  d=d
    .replace(/o+b+(?=[aeiouy])/g,'')
    .replace(/a[wh]?b(?=[aeiouy])/g,'')
    .replace(/u+b(?=[aeiouy])/g,'')
    .replace(/op(?=[aeiouy])/g,'');

  return preserveCase(original,d);
}
function decodeOb(text){return mapWords(text,decodeObWord)}

function decodeUbbi(text){
  return mapWords(text,w=>preserveCase(
    w,
    w.toLowerCase()
      .replace(/u+b+(?=[aeiouy])/g,'')
      .replace(/you?b(?=[aeiouy])/g,'')
      .replace(/uhb(?=[aeiouy])/g,'')
  ));
}
function decodeRovar(text){
  return mapWords(text,w=>preserveCase(
    w,
    w.toLowerCase().replace(/([bcdfghjklmnpqrstvwxyz])o\1/gi,'$1')
  ));
}

const CLUSTERS='str spr scr spl shr thr sch squ ch sh th ph wh qu tr dr br cr fr gr pr bl cl fl gl pl sl sk sm sn sp st sw b c d f g h j k l m n p q r s t v w x y z'.split(' ');
const BASIC_WORDS=new Set(`the of and to a in is you that it he was for on are as with his they i at be this have from or one had by word but not what all were we when your can said there use an each which she do how their if will up other about out many then them these so some her would make like him into time has look two more write go see number no way could people my than first water been call who oil its now find long down day did get come made may part over hello name milo hear background noise table open should wait minute real test translator secret language speech clear room think through good yes lot testing longer sentence blue backpack under next bottle after school walk home play game together makes much harder final hope gets every okay me am our here where why really very just only also even still again around because before while during without within between little big small old new right left back front today tomorrow yesterday morning afternoon evening night please thank thanks sorry maybe probably definitely sure able want need know knew take took give gave tell told ask asked say says saying heard listening sound sounds music singing foreign family friend friends house car chair jacket coffee meeting everyone later bottles everything fine hard easy better best start stop record recording recorded translate translation decoder code crack cracked numbers letters digit digits phrase words`.split(/\s+/));
function englishWordScore(w){return BASIC_WORDS.has(w)?10:0}
function decodePigWord(word){
  const original=word,w=word.toLowerCase();
  if(w.length<3)return word;
  if(w.endsWith('way')||w.endsWith('yay'))return preserveCase(original,w.slice(0,-3));
  if(!w.endsWith('ay'))return word;
  const stem=w.slice(0,-2),guesses=[stem];
  for(const c of CLUSTERS)if(stem.endsWith(c)&&stem.length>c.length)guesses.push(c+stem.slice(0,-c.length));
  guesses.sort((a,b)=>englishWordScore(b)-englishWordScore(a));
  return preserveCase(original,guesses[0]);
}
function decodePig(text){return mapWords(text,decodePigWord)}

function decodeByMode(text,mode){
  if(mode==='ob')return decodeOb(text);
  if(mode==='ubbi')return decodeUbbi(text);
  if(mode==='rovar')return decodeRovar(text);
  if(mode==='pig')return decodePig(text);
  if(mode.startsWith('custom:')){
    const lang=crackedLanguages.find(x=>x.id===mode.split(':')[1]);
    return decodeCustom(text,lang);
  }
  return text;
}
function normalizeSpaces(s){return String(s||'').replace(/\s+/g,' ').trim()}

// ---------- audio helpers ----------
function mergeFloat32(chunks){
  let total=0;
  for(const c of chunks)total+=c.length;
  const out=new Float32Array(total);
  let o=0;
  for(const c of chunks){out.set(c,o);o+=c.length}
  return out;
}
function resample(a,from,to=16000){
  if(from===to)return a;
  const ratio=from/to,n=Math.max(1,Math.floor(a.length/ratio)),out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const p=i*ratio,l=Math.floor(p),r=Math.min(l+1,a.length-1),f=p-l;
    out[i]=a[l]*(1-f)+a[r]*f;
  }
  return out;
}
function rms(a,s=0,e=a.length){
  let q=0,n=Math.max(1,e-s);
  for(let i=s;i<e;i++)q+=a[i]*a[i];
  return Math.sqrt(q/n);
}
function normalizeAudio(a){
  if(!a.length)return a;
  let mean=0;
  for(const x of a)mean+=x;
  mean/=a.length;
  let peak=0;
  for(let i=0;i<a.length;i++){a[i]-=mean;peak=Math.max(peak,Math.abs(a[i]))}
  if(peak>0&&peak<.85){
    const g=Math.min(6,.9/peak);
    for(let i=0;i<a.length;i++)a[i]*=g;
  }
  return a;
}
function trimSilence(a,sr=16000){
  if(a.length<sr*.6)return a;
  const frame=Math.floor(sr*.02),E=[];
  for(let s=0;s+frame<=a.length;s+=frame)E.push(rms(a,s,s+frame));
  const sorted=[...E].sort((x,y)=>x-y);
  const noise=sorted[Math.floor(sorted.length*.25)]||.002;
  const th=Math.max(.0032,noise*2.0);
  let f=0,l=E.length-1;
  while(f<E.length&&E[f]<th)f++;
  while(l>f&&E[l]<th)l--;
  const pad=Math.ceil(.35/.02);
  f=Math.max(0,f-pad);l=Math.min(E.length-1,l+pad);
  return a.slice(f*frame,Math.min(a.length,(l+1)*frame+frame));
}
function chunkAudio(a,sr=16000,secs=7.0,overlap=.35){
  const size=Math.floor(sr*secs),step=Math.floor(sr*(secs-overlap)),out=[];
  if(a.length<=size)return[a];
  for(let s=0;s<a.length;s+=step){
    const e=Math.min(a.length,s+size);
    out.push(a.slice(s,e));
    if(e===a.length)break;
  }
  return out;
}
function dedupeJoin(parts){
  const out=[];
  for(const part of parts){
    const ws=normalizeSpaces(part).split(' ').filter(Boolean);
    if(!ws.length)continue;
    let best=0;
    for(let k=Math.min(6,out.length,ws.length);k>=1;k--){
      if(out.slice(-k).join(' ')===ws.slice(0,k).join(' ')){best=k;break}
    }
    out.push(...ws.slice(best));
  }
  return out.join(' ');
}

// ---------- local speech models ----------
async function getHF(){
  if(HF)return HF;
  statusEl.textContent='';
  HF=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm');
  if(HF.env){
    HF.env.allowLocalModels=false;
    HF.env.useBrowserCache=true;
  }
  return HF;
}
async function getLiteral(){
  if(literalPipe)return literalPipe;
  if(literalLoading)return literalLoading;

  literalLoading=(async()=>{
    const M=await getHF();
    literalPipe=await M.pipeline(
      'automatic-speech-recognition',
      'Xenova/wav2vec2-base-960h',
      {
        quantized:true,
        progress_callback:p=>{
          if(processing&&typeof p?.progress==='number')
            setProgress(5+Math.min(100,p.progress)*.35);
        }
      }
    );
    return literalPipe;
  })();

  try{return await literalLoading}
  finally{literalLoading=null}
}
async function getWhisper(){
  if(whisperPipe)return whisperPipe;
  if(whisperLoading)return whisperLoading;

  whisperLoading=(async()=>{
    const M=await getHF();
    whisperPipe=await M.pipeline(
      'automatic-speech-recognition',
      'Xenova/whisper-base.en',
      {
        quantized:true,
        progress_callback:p=>{
          if(processing&&typeof p?.progress==='number')
            setProgress(5+Math.min(100,p.progress)*.35);
        }
      }
    );
    return whisperPipe;
  })();

  try{return await whisperLoading}
  finally{whisperLoading=null}
}

async function literalTranscribe(audio16k){
  const pipe=await getLiteral();
  const chunks=chunkAudio(audio16k);
  const parts=[];
  for(let i=0;i<chunks.length;i++){
    setProgress(42+52*((i+1)/chunks.length));
    const o=await pipe(chunks[i]);
    parts.push(String(o?.text||'').trim().toLowerCase());
    // Give the browser one paint between chunks.
    await new Promise(r=>setTimeout(r,0));
  }
  return dedupeJoin(parts);
}
async function whisperTranscribe(audio16k){
  const pipe=await getWhisper();
  const chunks=chunkAudio(audio16k,16000,9,.4);
  const parts=[];
  for(let i=0;i<chunks.length;i++){
    setProgress(42+52*((i+1)/chunks.length));
    const o=await pipe(chunks[i],{language:'english',task:'transcribe',return_timestamps:false});
    parts.push(String(o?.text||'').replace(/\[[^\]]+\]/g,'').trim().toLowerCase());
    await new Promise(r=>setTimeout(r,0));
  }
  return dedupeJoin(parts);
}


// ---------- Ob-specific recognition ----------
// Ob decoding itself is simple. The difficult part is getting useful text out of
// secret-speech audio. For Ob, we therefore treat the two recognizers as alternate
// ears and choose the result that actually looks like coherent English.

const BAD_ASR_PHRASES=[
  'music','singing in foreign language','foreign language','applause',
  'background noise','inaudible','unintelligible'
];

function textWords(text){
  return normalizeSpaces(text).toLowerCase().match(/[a-z']+/g)||[];
}

function englishQuality(text,duration=0){
  const s=normalizeSpaces(String(text||'').toLowerCase());
  const ws=textWords(s);
  if(!ws.length)return -100;

  let score=0,known=0,weird=0,oneLetter=0;
  const counts=new Map();

  for(const w of ws){
    counts.set(w,(counts.get(w)||0)+1);

    if(BASIC_WORDS.has(w)){
      known++;
      score+=7;
    }else{
      score-=1.5;
    }

    if(w.length===1 && w!=='a' && w!=='i'){
      oneLetter++;
      score-=4;
    }

    if(!/[aeiouy]/.test(w) && w.length>2){
      weird++;
      score-=3;
    }

    if(/^[^aeiouy]{4,}/.test(w)||/[^aeiouy]{4,}$/.test(w)){
      weird++;
      score-=2.5;
    }
  }

  const coverage=known/ws.length;
  score+=coverage*55;

  // Penalize repetitive hallucinations.
  let repeats=0;
  for(const n of counts.values())if(n>2)repeats+=n-2;
  score-=repeats*2.5;

  // Penalize extremely fragmented transcripts.
  score-=(oneLetter/ws.length)*35;
  score-=(weird/ws.length)*25;

  const lower=s.toLowerCase();
  for(const bad of BAD_ASR_PHRASES){
    if(lower===bad || lower.includes(`[${bad}]`) || lower.includes(`(${bad})`))score-=80;
  }

  // Duration sanity check. A 7 second speech chunk should not become one word,
  // or 70 tiny words.
  if(duration>0){
    const rate=ws.length/duration;
    if(duration>3 && rate<0.45)score-=25;
    if(rate>5.2)score-=30+(rate-5.2)*7;
  }

  // Long gibberish is worse than admitting the chunk was unclear.
  if(ws.length>18 && coverage<.35)score-=30;

  return score;
}

function obEvidence(text){
  const s=normalizeSpaces(String(text||'').toLowerCase());
  return (s.match(/(?:^|[^a-z])(?:ob|awb|ahb|ub|op)(?=[aeiouy])/g)||[]).length
       + (s.match(/o+b+(?=[aeiouy])/g)||[]).length;
}

function decodeObLoose(text){
  let s=normalizeSpaces(String(text||'').toLowerCase());

  // ASR sometimes separates the inserted syllable from the vowel/word.
  s=s
    .replace(/\b(?:ob|awb|ahb|ub|op)\s+(?=[aeiouy])/g,'')
    .replace(/\bo\s+b\s+(?=[aeiouy])/g,'')
    .replace(/\bo+b+(?=[aeiouy])/g,'')
    .replace(/\ba[wh]?b(?=[aeiouy])/g,'')
    .replace(/\bu+b(?=[aeiouy])/g,'')
    .replace(/\bop(?=[aeiouy])/g,'');

  return decodeOb(s);
}

function chooseObCandidate(whisperText,literalText,duration){
  const candidates=[];

  function add(label,text,bonus=0){
    text=normalizeSpaces(text);
    if(!text)return;
    let score=englishQuality(text,duration)+bonus;
    candidates.push({label,text,score});
  }

  // Whisper often helpfully hears through the Ob insertions and returns the
  // intended English directly, so this is a valid candidate.
  add('whisper-direct',whisperText,4);

  // If Whisper preserved any Ob syllables, strip them.
  const wd=decodeObLoose(whisperText);
  add('whisper-ob',wd,obEvidence(whisperText)*2);

  if(literalText){
    // Wav2Vec2 is useful only if removing Ob produces real English.
    const ld=decodeObLoose(literalText);
    const evidence=obEvidence(literalText);
    add('literal-ob',ld,evidence>=2 ? 6+Math.min(10,evidence) : -8);

    // Occasionally the literal recognizer already normalized the phrase.
    add('literal-direct',literalText,-5);
  }

  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0]||{label:'none',text:'',score:-100};

  return {best,candidates};
}

async function transcribeObHybrid(audio16k){
  const chunks=chunkAudio(audio16k,16000,7.2,.35);
  const englishParts=[];
  const rawParts=[];
  let totalScore=0,usable=0;

  // Primary recognizer: stronger Whisper Base. It is preloaded in Ob mode.
  const whisper=await getWhisper();

  for(let i=0;i<chunks.length;i++){
    const chunk=chunks[i];
    const duration=chunk.length/16000;

    setProgress(40+38*((i+1)/chunks.length));

    const wo=await whisper(chunk,{
      language:'english',
      task:'transcribe',
      return_timestamps:false
    });
    const w=normalizeSpaces(String(wo?.text||'')
      .replace(/\[[^\]]+\]/g,'')
      .replace(/\([^\)]+\)/g,'')
      .toLowerCase());

    // First choose using Whisper alone. Only call the literal model if this
    // chunk is genuinely weak.
    let picked=chooseObCandidate(w,'',duration);

    let l='';
    if(picked.best.score<48){
      setProgress(79+14*((i+1)/chunks.length));
      const literal=await getLiteral();
      const lo=await literal(chunk);
      l=normalizeSpaces(String(lo?.text||'').toLowerCase());
      picked=chooseObCandidate(w,l,duration);
    }

    rawParts.push(w || l || '');

    if(picked.best.score>=32){
      englishParts.push(picked.best.text);
      totalScore+=picked.best.score;
      usable++;
    }else{
      // Do not dump hundreds of nonsense words into the translation.
      englishParts.push('[unclear]');
    }

    await new Promise(r=>setTimeout(r,0));
  }

  setProgress(96);

  return{
    text:dedupeJoin(englishParts),
    raw:dedupeJoin(rawParts),
    confidence:usable
      ? Math.max(.05,Math.min(.98,(totalScore/usable+20)/100))
      : 0
  };
}


// ---------- capture ----------
async function startRecording(){
  if(processing||listening)return;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone capture is unavailable.');
  resetProgress();
  statusEl.textContent='';

  micStream=await navigator.mediaDevices.getUserMedia({
    audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1},
    video:false
  });

  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error('Web Audio is unavailable.');

  audioContext=new AC();
  if(audioContext.state==='suspended')await audioContext.resume();
  recordingSampleRate=audioContext.sampleRate;
  pcmChunks=[];

  micSource=audioContext.createMediaStreamSource(micStream);
  processor=audioContext.createScriptProcessor(4096,1,1);
  silenceGain=audioContext.createGain();
  silenceGain.gain.value=0;

  processor.onaudioprocess=e=>{
    if(listening)pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };

  micSource.connect(processor);
  processor.connect(silenceGain);
  silenceGain.connect(audioContext.destination);

  listening=true;
  micarea.classList.add('listening');
  mic.textContent='■';
  statusEl.textContent='Recording…';
}

// This is deliberately synchronous: the button changes back immediately.
function stopCaptureNow(){
  if(!listening)return null;

  listening=false;
  micarea.classList.remove('listening');
  mic.textContent='🎤';
  statusEl.textContent='';

  try{processor&&(processor.onaudioprocess=null)}catch{}
  try{processor?.disconnect()}catch{}
  try{micSource?.disconnect()}catch{}
  try{silenceGain?.disconnect()}catch{}
  try{micStream?.getTracks().forEach(t=>t.stop())}catch{}

  const captured=pcmChunks;
  const sr=recordingSampleRate;
  pcmChunks=[];

  const ctx=audioContext;
  audioContext=micStream=micSource=processor=silenceGain=null;
  try{ctx?.close()}catch{}

  return{chunks:captured,sampleRate:sr};
}

async function processCapture(captured){
  if(!captured||processing)return;
  processing=true;
  setProgress(2);

  try{
    const merged=mergeFloat32(captured.chunks);
    if(!merged.length)throw new Error('No audio was recorded.');

    let audio16k=resample(merged,captured.sampleRate,16000);
    audio16k=trimSilence(normalizeAudio(audio16k),16000);
    if(rms(audio16k)<.0008)throw new Error('The recording was nearly silent.');

    // OB: recognize in short chunks, compare multiple interpretations, then
    // strip Ob only when that actually improves the English.
    if(selectedMode==='ob'){
      const rec=await transcribeObHybrid(audio16k);

      input.value=rec.raw;
      heard.textContent=rec.raw||'Nothing heard.';
      result.textContent=rec.text||'—';
      pill.textContent='Ob → ENGLISH';
      confidenceEl.textContent=rec.confidence
        ? 'Confidence: '+Math.round(rec.confidence*100)+'%'
        : 'Low confidence';
      details.classList.add('hidden');

      finishProgress();
      statusEl.textContent='Done.';
      return;
    }

    let raw='';
    if(selectedMode==='pig'){
      raw=await whisperTranscribe(audio16k);
    }else{
      raw=await literalTranscribe(audio16k);
    }

    setProgress(97);

    if(selectedMode==='crack'){
      recognitionTarget.value=raw;
      heard.textContent=raw||'Nothing heard.';
      finishProgress();
      statusEl.textContent='Done.';
      return;
    }

    if(selectedMode.startsWith('custom:')){
      recognitionTarget.value=raw;
      heard.textContent=raw||'Nothing heard.';
      renderTypedTranslation();
      finishProgress();
      statusEl.textContent='Done.';
      return;
    }

    const translated=decodeByMode(raw,selectedMode);

    input.value=raw;
    heard.textContent=raw||'Nothing heard.';
    result.textContent=translated||'—';
    pill.textContent=MODE_NAMES[selectedMode]+' → ENGLISH';
    confidenceEl.textContent='';
    details.classList.add('hidden');

    finishProgress();
    statusEl.textContent='Done.';
  }catch(err){
    console.error(err);
    resetProgress();
    statusEl.textContent='Could not transcribe: '+String(err?.message||err);
  }finally{
    processing=false;
  }
}

// ---------- custom cracker ----------
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function loadLanguages(){try{return JSON.parse(localStorage.getItem('crackedLanguagesV4')||'[]')}catch{return[]}}
function saveLanguages(v){localStorage.setItem('crackedLanguagesV4',JSON.stringify(v))}
let crackedLanguages=loadLanguages();


const NUMBER_WORDS={
  zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',
  six:'6',seven:'7',eight:'8',nine:'9',ten:'10',
  eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',
  fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',
  nineteen:'19',twenty:'20',twentyone:'21',twentytwo:'22',
  twentythree:'23',twentyfour:'24',twentyfive:'25',twentysix:'26'
};

function numberWordsToDigits(text){
  return String(text||'').toLowerCase().replace(
    /\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|twentyone|twentytwo|twentythree|twentyfour|twentyfive|twentysix)\b/g,
    m=>NUMBER_WORDS[m]??m
  );
}

function alphaWords(text){
  return String(text||'').toLowerCase().match(/[a-z']+/g)||[];
}

function englishTextScore(text){
  const ws=alphaWords(text);
  if(!ws.length)return -30;
  let score=0,known=0;
  for(const w of ws){
    if(BASIC_WORDS.has(w)){score+=12;known++}
    else{
      score-=0.65;
      if(/[aeiou]/.test(w))score+=0.25;
      if(/^[^aeiou]{4,}/.test(w)||/[^aeiou]{4,}$/.test(w))score-=2;
    }
  }
  score+=(known/ws.length)*12;
  score+=Math.min(8,ws.length*.5);
  score-=(String(text).match(/\d/g)||[]).length*.7;
  return score;
}

function wordBreakEnglish(letters){
  const s=String(letters||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!s)return '';
  const n=s.length;
  const dp=Array(n+1).fill(null);
  dp[0]={score:0,words:[]};

  for(let i=0;i<n;i++){
    if(!dp[i])continue;
    for(let j=i+1;j<=Math.min(n,i+18);j++){
      const w=s.slice(i,j);
      let add;
      if(BASIC_WORDS.has(w))add=20+w.length;
      else if(w.length===1&&(w==='a'||w==='i'))add=10;
      else if(w.length>=2)add=-2.2*w.length;
      else add=-5;

      const cand={score:dp[i].score+add,words:[...dp[i].words,w]};
      if(!dp[j]||cand.score>dp[j].score)dp[j]=cand;
    }
  }

  const best=dp[n];
  if(!best)return s;
  const known=best.words.filter(w=>BASIC_WORDS.has(w)||w==='a'||w==='i').length;
  return known>=Math.max(1,Math.floor(best.words.length*.45))
    ? best.words.join(' ')
    : s;
}

function numericTokens(text){
  return String(text||'').match(/\d{1,3}/g)||[];
}

function decodeA1Z26(text){
  const nums=numericTokens(text).map(Number);
  if(nums.length<2||nums.some(n=>n<1||n>26))return String(text||'');
  const letters=nums.map(n=>String.fromCharCode(96+n)).join('');
  return wordBreakEnglish(letters);
}

function decodeASCII(text){
  const nums=numericTokens(text).map(Number);
  if(nums.length<2||nums.some(n=>n<32||n>126))return String(text||'');
  return normalizeSpaces(nums.map(n=>String.fromCharCode(n)).join(''));
}

const T9={
  a:'2',b:'2',c:'2',d:'3',e:'3',f:'3',g:'4',h:'4',i:'4',
  j:'5',k:'5',l:'5',m:'6',n:'6',o:'6',p:'7',q:'7',r:'7',s:'7',
  t:'8',u:'8',v:'8',w:'9',x:'9',y:'9',z:'9'
};
function t9Signature(word){
  return [...String(word||'').toLowerCase()].map(c=>T9[c]||'').join('');
}
const T9_DICTIONARY=(()=>{
  const m=new Map();
  for(const w of BASIC_WORDS){
    if(w.length<2)continue;
    const sig=t9Signature(w);
    if(!m.has(sig))m.set(sig,[]);
    m.get(sig).push(w);
  }
  return m;
})();

function decodeT9(text){
  const groups=String(text||'').trim().split(/[\s,;/|]+/).filter(Boolean);
  if(!groups.length||groups.some(g=>!/^[2-9]+$/.test(g)))return String(text||'');
  const out=[];
  for(const g of groups){
    const choices=T9_DICTIONARY.get(g);
    if(!choices?.length)return String(text||'');
    out.push(choices[0]);
  }
  return out.join(' ');
}

const LEET_MAPS=[
  {'0':'o','1':'i','2':'z','3':'e','4':'a','5':'s','6':'g','7':'t','8':'b','9':'g'},
  {'0':'o','1':'l','2':'s','3':'e','4':'a','5':'s','6':'g','7':'t','8':'b','9':'p'},
  {'0':'o','1':'i','2':'to','3':'e','4':'a','5':'s','6':'g','7':'t','8':'b','9':'q'}
];

function applyDigitMap(text,map){
  return String(text||'').replace(/\d/g,d=>map[d]??d);
}

function removeTokenEverywhere(text,token){
  if(!token)return String(text||'');
  return normalizeSpaces(String(text||'').replace(new RegExp(escapeRegExp(token),'g'),' '));
}

function crackLanguage(corpus,previous=null){
  const original=String(corpus||'').trim();
  if(!original)return null;

  // IMPORTANT: digits are preserved. The previous cracker deleted them.
  const normalized=numberWordsToDigits(original)
    .toLowerCase()
    .replace(/[^a-z0-9\s'\/|,;:\-]/g,' ');

  const ws=normalized.match(/[a-z0-9']+/g)||[];
  if(!ws.length)return null;

  const candidates=[];

  function pushCandidate(rule,decoded,bonus=0,count=1){
    decoded=normalizeSpaces(decoded);
    if(!decoded)return;
    let score=englishTextScore(decoded)+bonus;
    if(previous?.rule?.type===rule.type)score+=4;
    if(previous?.rule?.token&&previous.rule.token===rule.token)score+=3;
    candidates.push({rule,decoded,score,count,preview:decoded});
  }

  const nums=numericTokens(normalized);

  // A=1, B=2 ... Z=26
  if(nums.length>=2){
    const a1=decodeA1Z26(normalized);
    if(a1!==normalized)pushCandidate({type:'numericA1Z26'},a1,22,nums.length);

    // Decimal ASCII: 104 101 108 108 111 -> hello
    const ascii=decodeASCII(normalized);
    if(ascii!==normalized)pushCandidate({type:'numericASCII'},ascii,24,nums.length);

    // Phone keypad/T9: 43556 69 -> hello my
    const t9=decodeT9(normalized);
    if(t9!==normalized)pushCandidate({type:'numericT9'},t9,20,nums.length);
  }

  // h3ll0 / n4m3 style codes.
  if(/\d/.test(normalized)&&/[a-z]/.test(normalized)){
    for(let i=0;i<LEET_MAPS.length;i++){
      pushCandidate({type:'leet',mapIndex:i},applyDigitMap(normalized,LEET_MAPS[i]),8);
    }
  }

  // Repeated inserted number/token.
  const numberCounts=new Map();
  for(const n of nums)numberCounts.set(n,(numberCounts.get(n)||0)+1);
  for(const[token,count]of numberCounts){
    if(count>=2){
      pushCandidate(
        {type:'removeToken',token},
        removeTokenEverywhere(normalized,token),
        Math.min(15,count*2),
        count
      );
    }
  }

  // General repeating insertion patterns; tokens may contain letters OR numbers.
  const before=new Map(),after=new Map(),dup=new Map();

  for(const w of ws){
    for(let i=1;i<w.length;i++){
      if(V.includes(w[i])){
        for(let len=1;len<=3;len++)if(i-len>=0){
          const t=w.slice(i-len,i);
          if(/^[a-z0-9]+$/.test(t))before.set(t,(before.get(t)||0)+1);
        }
      }
    }

    for(let i=0;i<w.length-1;i++){
      if(V.includes(w[i])){
        for(let len=1;len<=3;len++)if(i+1+len<=w.length){
          const t=w.slice(i+1,i+1+len);
          if(/^[a-z0-9]+$/.test(t))after.set(t,(after.get(t)||0)+1);
        }
      }
    }

    for(let i=0;i<w.length;i++){
      const c=w[i];
      if(!/[bcdfghjklmnpqrstvwxyz]/.test(c))continue;
      for(let len=1;len<=3;len++){
        const j=i+1+len;
        if(j<w.length&&w[j]===c){
          const t=w.slice(i+1,j);
          if(/^[a-z0-9]+$/.test(t))dup.set(t,(dup.get(t)||0)+1);
        }
      }
    }
  }

  for(const[t,c]of before)if(c>=2){
    const decoded=ws.map(w=>w.replace(new RegExp(escapeRegExp(t)+'(?=[aeiouy])','g'),'')).join(' ');
    pushCandidate({type:'insertBeforeVowel',token:t},decoded,c*2,c);
  }

  for(const[t,c]of after)if(c>=2){
    const decoded=ws.map(w=>w.replace(new RegExp('([aeiouy])'+escapeRegExp(t),'g'),'$1')).join(' ');
    pushCandidate({type:'insertAfterVowel',token:t},decoded,c*2,c);
  }

  for(const[t,c]of dup)if(c>=2){
    const decoded=ws.map(w=>w.replace(new RegExp('([bcdfghjklmnpqrstvwxyz])'+escapeRegExp(t)+'\\1','g'),'$1')).join(' ');
    pushCandidate({type:'duplicateConsonant',token:t},decoded,c*2,c);
  }

  // Same number at the start/end of many words.
  const prefixCounts=new Map(),suffixCounts=new Map();
  for(const w of ws){
    const p=w.match(/^(\d{1,3})/),s=w.match(/(\d{1,3})$/);
    if(p)prefixCounts.set(p[1],(prefixCounts.get(p[1])||0)+1);
    if(s)suffixCounts.set(s[1],(suffixCounts.get(s[1])||0)+1);
  }

  for(const[token,count]of prefixCounts)if(count>=2){
    const decoded=ws.map(w=>w.replace(new RegExp('^'+escapeRegExp(token)),'')).join(' ');
    pushCandidate({type:'numericPrefix',token},decoded,count*3,count);
  }

  for(const[token,count]of suffixCounts)if(count>=2){
    const decoded=ws.map(w=>w.replace(new RegExp(escapeRegExp(token)+'$'),'')).join(' ');
    pushCandidate({type:'numericSuffix',token},decoded,count*3,count);
  }

  if(!candidates.length){
    return{
      rule:{type:'unknown',token:''},
      confidence:.12,
      explanation:'No strong rule found yet. Add more examples.',
      samples:original,
      preview:original
    };
  }

  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0];
  const gap=candidates.length>1?best.score-candidates[1].score:10;
  const confidence=Math.max(.2,Math.min(.98,.48+Math.min(.32,gap/30)+Math.min(.18,best.count/15)));

  return{
    rule:best.rule,
    confidence,
    explanation:ruleLabelFromRule(best.rule),
    samples:original,
    preview:best.decoded
  };
}

function decodeCustom(text,lang){
  if(!lang?.rule)return text;
  const r=lang.rule,t=escapeRegExp(r.token||'');

  if(r.type==='numericA1Z26')return decodeA1Z26(numberWordsToDigits(text));
  if(r.type==='numericASCII')return decodeASCII(numberWordsToDigits(text));
  if(r.type==='numericT9')return decodeT9(numberWordsToDigits(text));
  if(r.type==='leet')return applyDigitMap(text,LEET_MAPS[r.mapIndex||0]);
  if(r.type==='removeToken')return removeTokenEverywhere(text,r.token);

  if(r.type==='numericPrefix')
    return String(text||'').split(/\s+/).map(w=>w.replace(new RegExp('^'+t),'')).join(' ');
  if(r.type==='numericSuffix')
    return String(text||'').split(/\s+/).map(w=>w.replace(new RegExp(t+'$'),'')).join(' ');

  if(r.type==='insertBeforeVowel')
    return String(text||'').replace(new RegExp(t+'(?=[aeiouy])','gi'),'');
  if(r.type==='insertAfterVowel')
    return String(text||'').replace(new RegExp('([aeiouy])'+t,'gi'),'$1');
  if(r.type==='duplicateConsonant')
    return String(text||'').replace(new RegExp('([bcdfghjklmnpqrstvwxyz])'+t+'\\1','gi'),'$1');

  return text;
}

function ruleLabelFromRule(r){
  if(!r)return'Unknown';
  if(r.type==='numericA1Z26')return'Numbers 1–26 represent A–Z';
  if(r.type==='numericASCII')return'Numbers are ASCII character codes';
  if(r.type==='numericT9')return'Numbers use phone-keypad (T9) letter groups';
  if(r.type==='leet')return'Digits replace similar-looking letters';
  if(r.type==='removeToken')return`Remove repeated number/token “${r.token}”`;
  if(r.type==='numericPrefix')return`Remove “${r.token}” from the start of each word`;
  if(r.type==='numericSuffix')return`Remove “${r.token}” from the end of each word`;
  if(r.type==='insertBeforeVowel')return`Remove “${r.token}” before vowels`;
  if(r.type==='insertAfterVowel')return`Remove “${r.token}” after vowels`;
  if(r.type==='duplicateConsonant')return`Collapse consonant + “${r.token}” + same consonant`;
  return'Still learning the rule';
}

function nextLanguageName(){
  let n=1;
  while(crackedLanguages.some(x=>x.name===`Cracked ${n}`))n++;
  return`Cracked ${n}`;
}
function renderCustomModes(){
  document.querySelectorAll('.custom-mode-wrap').forEach(x=>x.remove());
  for(const lang of crackedLanguages){
    const wrap=document.createElement('div');
    wrap.className='custom-mode-wrap';
    wrap.style.position='relative';
    wrap.innerHTML=`<button class="mode" data-mode="custom:${lang.id}"><b>🔓</b>${escapeHtml(lang.name)}</button><button class="delete-mini" data-delete="${lang.id}" title="Delete">×</button>`;
    modesEl.appendChild(wrap);
  }
}
function showCustomInfo(id){
  const lang=crackedLanguages.find(x=>x.id===id);
  if(!lang)return;
  customInfoCard.classList.remove('hidden');
  customRuleTitle.textContent=ruleLabelFromRule(lang.rule);
  customConfidence.textContent='Confidence: '+Math.round(lang.confidence*100)+'%';
  customDetails.textContent=lang.explanation||'';
}
function selectMode(mode){
  if(processing)return;
  selectedMode=mode;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  crackPanel.classList.toggle('hidden',mode!=='crack');
  customInfoCard.classList.add('hidden');
  addInfoPanel.classList.add('hidden');
  recognitionTarget=mode==='crack'?crackInput:input;
  if(mode.startsWith('custom:'))showCustomInfo(mode.split(':')[1]);

  // Quiet preload for the selected mode. This does not show the progress bar.
  if(mode==='ob'||mode==='pig')setTimeout(()=>getWhisper().catch(()=>{}),25);
  else if(mode==='ubbi'||mode==='rovar'||mode==='crack'||mode.startsWith('custom:'))
    setTimeout(()=>getLiteral().catch(()=>{}),25);

  details.classList.add('hidden');
  confidenceEl.textContent='';
  if(input.value.trim()&&mode!=='crack')renderTypedTranslation();
}
function renderTypedTranslation(){
  const t=input.value.trim();
  if(!t){result.textContent='—';pill.textContent='WAITING';return}
  heard.textContent=t;
  result.textContent=decodeByMode(t,selectedMode)||'—';
  pill.textContent=(selectedMode.startsWith('custom:')
    ?(crackedLanguages.find(x=>x.id===selectedMode.split(':')[1])?.name||'Cracked')
    :MODE_NAMES[selectedMode])+' → ENGLISH';
  confidenceEl.textContent='';
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  catch(err){

    processing=false;listening=false;
    micarea.classList.remove('listening');
    mic.textContent='🎤';
    resetProgress();
    statusEl.textContent='Could not use the microphone: '+String(err?.message||err);
  }
});

input.addEventListener('input',()=>{
  if(input.value.trim())renderTypedTranslation();
});

crackBtn.addEventListener('click',()=>{
  const s=crackInput.value.trim();
  if(!s){statusEl.textContent='Add several examples first.';return}
  const found=crackLanguage(s);
  if(!found)return;
  const lang={id:Date.now().toString(36),name:nextLanguageName(),...found};
  crackedLanguages.push(lang);
  saveLanguages(crackedLanguages);
  renderCustomModes();
  crackInput.value='';
  selectMode(`custom:${lang.id}`);
  statusEl.textContent=`Created ${lang.name}.`;
});

addInfoBtn.addEventListener('click',()=>{
  addInfoPanel.classList.toggle('hidden');
  if(!addInfoPanel.classList.contains('hidden'))addInfoInput.focus();
});

improveBtn.addEventListener('click',()=>{
  if(!selectedMode.startsWith('custom:'))return;
  const id=selectedMode.split(':')[1],lang=crackedLanguages.find(x=>x.id===id),extra=addInfoInput.value.trim();
  if(!lang||!extra)return;
  const improved=crackLanguage((lang.samples+' '+extra).trim(),lang);
  Object.assign(lang,improved);
  saveLanguages(crackedLanguages);
  renderCustomModes();
  addInfoInput.value='';
  addInfoPanel.classList.add('hidden');
  showCustomInfo(id);
  statusEl.textContent='Language updated.';
});

// Internal rule checks.
function runSelfTests(){
  const tests=[
    [decodeOb(encodeOb('hello my name is milo')),'hello my name is milo'],
    [decodeUbbi('hubellubo'),'hello'],
    [decodeRovar('hohelollolo'),'hello'],
    [decodePig('ellohay'),'hello']
  ];
  const bad=tests.filter(([g,w])=>g.toLowerCase()!==w.toLowerCase());
  if(bad.length){
    $('selftest').style.display='block';
    $('selftest').textContent='Internal decoder check failed.';
    console.error(bad);
  }
}

runSelfTests();
renderCustomModes();
selectMode('ob');

// Quietly preload the literal model after the page becomes idle.
// No progress bar is shown because processing=false.
const warm=()=>getWhisper().catch(e=>console.warn('Background Ob model preload failed',e));
if('requestIdleCallback' in window)requestIdleCallback(warm,{timeout:1100});
else setTimeout(warm,650);
</script>
