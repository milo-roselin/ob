<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><title>Secret Translator</title><style>
:root{--card:#111e33;--card2:#172842;--text:#fff;--muted:#9db0ca;--accent:#57c8ff;--red:#ff5d73;--line:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#10203a,#07111f);color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:14px}.app{width:min(850px,100%);margin:auto}h1{text-align:center;font-size:clamp(30px,7vw,56px);margin:7px 0}.version{text-align:center;font-size:11px;color:#7f95b3}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:13px 0}.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:10px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{min-height:62px;background:var(--card2);border:1px solid var(--line);border-radius:15px;color:#fff;font-weight:800}.mode.active{border-color:var(--accent);background:rgba(87,200,255,.13)}.mode b{display:block;font-size:22px}.micarea{text-align:center}.micwrap{width:145px;height:145px;margin:auto;display:grid;place-items:center;position:relative}.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(87,200,255,.2)}.mic{z-index:2;width:100px;height:100px;border:0;border-radius:50%;font-size:40px;background:var(--accent)}.recording .mic{background:var(--red);color:white}.recording .ring{border-color:var(--red);animation:pulse 1.1s infinite}@keyframes pulse{to{transform:scale(1.25);opacity:0}}.status{text-align:center;color:var(--muted);font-size:14px;min-height:22px}.status.error{color:#ffb7c1}.result{font-weight:900;font-size:clamp(25px,6vw,42px);overflow-wrap:anywhere}.heard{color:var(--muted);overflow-wrap:anywhere}.pill{display:inline-block;background:rgba(87,200,255,.1);color:#bfeaff;border:1px solid rgba(87,200,255,.2);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:8px}textarea{width:100%;min-height:88px;background:#0b1729;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:17px}.btn{width:100%;min-height:48px;border:0;border-radius:13px;background:var(--accent);font-weight:850;font-size:16px;margin-top:9px}@media(max-width:360px){body{padding:7px}h1{font-size:22px}.card{padding:9px;margin:7px 0}.modes{grid-template-columns:repeat(2,1fr);gap:5px}.mode{min-height:45px;font-size:11px}.mode b{font-size:16px}.micwrap{width:92px;height:92px}.mic{width:64px;height:64px;font-size:28px}.result{font-size:20px}textarea{min-height:60px;font-size:14px}}
</style></head><body><main class="app"><h1>Secret Translator</h1><div class="version">FIXED VERSION 2.0</div><section class="card"><div class="label">Language</div><div class="modes"><button class="mode active" data-mode="auto"><b>✨</b>Auto</button><button class="mode" data-mode="ob"><b>🅾️</b>Ob</button><button class="mode" data-mode="pig"><b>🐷</b>Pig Latin</button><button class="mode" data-mode="ubbi"><b>🔵</b>Ubbi</button><button class="mode" data-mode="rovar"><b>🕵️</b>Rövar</button><button class="mode" data-mode="normal"><b>💬</b>Normal</button></div></section><section class="card micarea" id="micarea"><div class="micwrap"><div class="ring"></div><button class="mic" id="mic">🎤</button></div><div class="status" id="status">Tap to record. Tap again to translate.</div></section><section class="card"><div class="label">Watch fallback: type or dictate</div><textarea id="typed" placeholder="Tap here and use watch dictation/keyboard"></textarea><button class="btn" id="translateText">Translate Text</button></section><section class="card"><div class="pill" id="pill">WAITING</div><div class="label">English Translation</div><div class="result" id="result">—</div></section><section class="card"><div class="label">What it heard</div><div class="heard" id="heard">Nothing yet.</div></section></main><script>
const buttons=[...document.querySelectorAll('.mode')],mic=document.getElementById('mic'),micarea=document.getElementById('micarea'),statusEl=document.getElementById('status'),heard=document.getElementById('heard'),result=document.getElementById('result'),pill=document.getElementById('pill'),typed=document.getElementById('typed'),translateText=document.getElementById('translateText');let mode='auto',recorder=null,stream=null,chunks=[],recording=false;const names={auto:'Auto',ob:'Ob',pig:'Pig Latin',ubbi:'Ubbi Dubbi',rovar:'Rövarspråket',normal:'Normal'};buttons.forEach(b=>b.onclick=()=>{mode=b.dataset.mode;buttons.forEach(x=>x.classList.toggle('active',x===b))});function status(t,e=false){statusEl.textContent=t;statusEl.classList.toggle('error',e)}async function parseResponse(r){const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error(`Server returned HTTP ${r.status}: ${text.trim().slice(0,160)||'(empty response)'}`)}if(!r.ok)throw new Error(data?.error||`HTTP ${r.status}`);return data}function show(d){heard.textContent=d.transcript||'Nothing detected.';result.textContent=d.translation||'—';pill.textContent=(names[d.mode]||d.mode)+' → ENGLISH'}async function start(){try{status('Requesting microphone…');if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('Direct microphone recording is not available here. Use the text box with dictation.');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});const c=['audio/mp4','audio/webm;codecs=opus','audio/webm'];let mime='';for(const x of c){if(MediaRecorder.isTypeSupported(x)){mime=x;break}}recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=sendAudio;recorder.start();recording=true;micarea.classList.add('recording');mic.textContent='■';status('Listening… tap again when finished.')}catch(e){status(e.message||'Microphone unavailable.',true);typed.focus()}}function stop(){if(!recorder||recorder.state==='inactive')return;recorder.stop();stream?.getTracks().forEach(t=>t.stop());recording=false;micarea.classList.remove('recording');mic.textContent='🎤';status('Sending audio…')}async function sendAudio(){try{const type=recorder?.mimeType||chunks[0]?.type||'audio/webm';const blob=new Blob(chunks,{type});if(blob.size<1000)throw new Error('Recording was too short.');const form=new FormData();form.append('audio',blob,'speech.'+(type.includes('mp4')?'m4a':'webm'));form.append('mode',mode);const d=await parseResponse(await fetch('/api/transcribe',{method:'POST',body:form}));show(d);status('Finished ✓')}catch(e){status('Error: '+e.message,true)}}mic.onclick=()=>recording?stop():start();translateText.onclick=async()=>{const text=typed.value.trim();if(!text)return status('Type or dictate something first.',true);try{status('Translating…');const d=await parseResponse(await fetch('/api/decode-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,mode})}));show(d);status('Finished ✓')}catch(e){status('Error: '+e.message,true)}};fetch('/api/health').then(parseResponse).then(d=>{if(!d.keyConfigured)status('Server is running, but OPENAI_API_KEY is missing.',true)}).catch(e=>status('Backend check failed: '+e.message,true));
</script></body></html>
