<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Secret Translator</title>
<style>
:root{
  --bg:#07111f;--card:#111e33;--card2:#172842;--text:#fff;--muted:#9db0ca;
  --accent:#57c8ff;--red:#ff5d73;--green:#63e6a3;--line:rgba(255,255,255,.1)
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:linear-gradient(#10203a,#07111f);
  color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:14px
}
.app{width:min(900px,100%);margin:auto}
h1{text-align:center;font-size:clamp(30px,7vw,56px);line-height:1;margin:7px 0}
.sub{text-align:center;color:var(--muted);margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:13px}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{min-height:66px;background:var(--card2);border:1px solid var(--line);border-radius:15px;color:#fff;font-weight:800;font-size:14px;padding:8px}
.mode.active{border-color:var(--accent);background:rgba(87,200,255,.13)}
.mode b{display:block;font-size:22px}
.mode small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.custom-mode{position:relative}
.delete-mini{
  position:absolute;right:5px;top:5px;width:25px;height:25px;border:0;border-radius:50%;
  background:rgba(255,255,255,.10);color:#fff;font-size:14px
}
.micarea{text-align:center}
.micwrap{width:150px;height:150px;margin:auto;display:grid;place-items:center;position:relative}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(87,200,255,.2)}
.mic{position:relative;z-index:2;width:104px;height:104px;border:0;border-radius:50%;font-size:42px;background:var(--accent)}
.listening .mic{background:var(--red);color:#fff}
.listening .ring{border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{to{transform:scale(1.25);opacity:0}}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:21px;margin-top:4px}
.good{color:var(--green)} .error{color:#ffb7c1}
textarea,input[type="text"]{
  width:100%;background:#0b1729;color:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px;font:inherit;font-size:17px
}
textarea{min-height:95px;resize:vertical}
.btn{
  width:100%;min-height:48px;border:0;border-radius:13px;background:var(--accent);
  font-weight:850;font-size:16px;margin-top:9px
}
.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}
.danger{background:rgba(255,93,115,.14);color:#ffd4dc;border:1px solid rgba(255,93,115,.3)}
.result{font-weight:900;font-size:clamp(25px,6vw,42px);line-height:1.2;overflow-wrap:anywhere}
.heard{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
.pill{display:inline-block;background:rgba(87,200,255,.1);color:#bfeaff;border:1px solid rgba(87,200,255,.2);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:8px}
.note{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
.crack-card{border-color:rgba(99,230,163,.25)}
.rulebox{background:#0b1729;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.rule-title{font-weight:900;margin-bottom:5px}
.confidence{font-size:12px;color:var(--green);font-weight:800}
.examples{font-size:13px;color:var(--muted);margin-top:6px}
.addinfo{margin-top:14px}
@media(max-width:520px){
  .modes{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:360px),(max-height:420px) and (max-width:500px){
  body{padding:6px}
  h1{font-size:21px;margin:3px 0}
  .sub{display:none}
  .card{border-radius:14px;padding:8px;margin-bottom:6px}
  .label{font-size:9px;margin-bottom:5px}
  .modes{grid-template-columns:repeat(2,1fr);gap:4px}
  .mode{min-height:42px;font-size:10px;border-radius:10px;padding:3px}
  .mode b{font-size:15px}
  .mode small{font-size:8px}
  .delete-mini{width:19px;height:19px;font-size:10px}
  .micwrap{width:86px;height:86px}
  .mic{width:60px;height:60px;font-size:25px}
  .status{font-size:10px;line-height:1.2}
  textarea,input[type="text"]{min-height:58px;font-size:13px;padding:7px}
  .btn{min-height:38px;font-size:12px;margin-top:5px}
  .result{font-size:19px}
  .heard{font-size:11px}
  .pill{font-size:8px;padding:3px 6px}
  .note{font-size:10px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="app">
  <h1>Secret Translator</h1>
  <div class="sub">Decode known secret languages — or crack a new one.</div>

  <section class="card">
    <div class="label">Language</div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="auto"><b>✨</b>Auto</button>
      <button class="mode" data-mode="ob"><b>🅾️</b>Ob</button>
      <button class="mode" data-mode="pig"><b>🐷</b>Pig Latin</button>
      <button class="mode" data-mode="ubbi"><b>🔵</b>Ubbi</button>
      <button class="mode" data-mode="rovar"><b>🕵️</b>Rövar</button>
      <button class="mode" data-mode="normal"><b>💬</b>Normal</button>
      <button class="mode" data-mode="crack"><b>🧩</b>Crack New<small>Find a new pattern</small></button>
    </div>
  </section>

  <section class="card crack-card hidden" id="crackPanel">
    <div class="label">Crack a new language</div>
    <textarea id="crackInput" placeholder="Enter or dictate several examples of the secret language. More examples = a better guess."></textarea>
    <button class="btn" id="crackBtn">Analyze & Create Language</button>
    <div id="crackPreview" class="hidden"></div>
  </section>

  <section class="card micarea" id="micarea">
    <div class="micwrap"><div class="ring"></div><button class="mic" id="mic">🎤</button></div>
    <div class="status" id="status">Tap the microphone to record.</div>
  </section>

  <section class="card" id="translateCard">
    <div class="label">Type or use device dictation</div>
    <textarea id="input" placeholder="Tap the microphone above, or type here"></textarea>
    <div class="row">
      <button class="btn" id="translate">Translate</button>
      <button class="btn secondary" id="clear">Clear</button>
    </div>
  </section>

  <section class="card">
    <div class="pill" id="pill">WAITING</div>
    <div class="label">English translation</div>
    <div class="result" id="result">—</div>
  </section>

  <section class="card">
    <div class="label">What it heard / what you entered</div>
    <div class="heard" id="heard">Nothing yet.</div>
  </section>

  <section class="card hidden" id="customInfoCard">
    <div class="label">Cracked language</div>
    <div class="rulebox">
      <div class="rule-title" id="customRuleTitle"></div>
      <div class="confidence" id="customConfidence"></div>
      <div class="examples" id="customDetails"></div>
    </div>
    <button class="btn secondary addinfo" id="addInfoBtn">+ Add Info</button>
    <div id="addInfoPanel" class="hidden">
      <textarea id="addInfoInput" placeholder="Add more examples of this secret language so the app can improve its guess."></textarea>
      <button class="btn" id="improveBtn">Use New Info</button>
    </div>
  </section>
</main>

<script>
const input=document.getElementById("input");
const result=document.getElementById("result");
const heard=document.getElementById("heard");
const statusEl=document.getElementById("status");
const pill=document.getElementById("pill");
const mic=document.getElementById("mic");
const micarea=document.getElementById("micarea");
const translateBtn=document.getElementById("translate");
const clearBtn=document.getElementById("clear");
const modesEl=document.getElementById("modes");
const crackPanel=document.getElementById("crackPanel");
const crackInput=document.getElementById("crackInput");
const crackBtn=document.getElementById("crackBtn");
const crackPreview=document.getElementById("crackPreview");
const customInfoCard=document.getElementById("customInfoCard");
const customRuleTitle=document.getElementById("customRuleTitle");
const customConfidence=document.getElementById("customConfidence");
const customDetails=document.getElementById("customDetails");
const addInfoBtn=document.getElementById("addInfoBtn");
const addInfoPanel=document.getElementById("addInfoPanel");
const addInfoInput=document.getElementById("addInfoInput");
const improveBtn=document.getElementById("improveBtn");

let selectedMode="auto";
let listening=false;
let recognitionTarget=input;

const names={auto:"Auto",ob:"Ob",pig:"Pig Latin",ubbi:"Ubbi Dubbi",rovar:"Rövarspråket",normal:"Normal",crack:"Crack New"};

function loadLanguages(){
  try{return JSON.parse(localStorage.getItem("crackedLanguages")||"[]")}catch{return []}
}
function saveLanguages(langs){
  localStorage.setItem("crackedLanguages",JSON.stringify(langs));
}
let crackedLanguages=loadLanguages();

function preserveCase(original,replacement){
  if(!original)return replacement;
  if(!replacement)return "";
  if(original===original.toUpperCase())return replacement.toUpperCase();
  if(original[0]===original[0].toUpperCase())return replacement[0].toUpperCase()+replacement.slice(1).toLowerCase();
  return replacement.toLowerCase();
}
function mapWords(text,fn){return text.replace(/[A-Za-zÀ-ÖØ-öø-ÿ']+/g,fn)}

function decodeOb(text){return mapWords(text,w=>preserveCase(w,w.replace(/ob(?=[aeiouy])/gi,"")))}
function decodeUbbi(text){return mapWords(text,w=>preserveCase(w,w.replace(/ub(?=[aeiouy])/gi,"")))}
function decodeRovar(text){return mapWords(text,w=>preserveCase(w,w.toLowerCase().replace(/([bcdfghjklmnpqrstvwxyz])o\1/gi,"$1")))}

const COMMON=new Set(("a i about after again all am and are as at away back be because been before big but by call came can come could day did do does dog down eat english even find fish for friend from game get give go going good got had has have he hello help her here him his home house how if in into is it just know language like little look made make me more morning my night no not now of on one or our out pig play please really said say school secret see she so some something take tell thank that the their them then there they think this time to today tomorrow up us very want was water way we well were what when where which who why will with would yes you your").split(" "));
const CLUSTERS=("str spr scr spl shr thr sch squ ch sh th ph wh qu tr dr br cr fr gr pr bl cl fl gl pl sl sk sm sn sp st sw b c d f g h j k l m n p q r s t v w x y z").split(" ");

function englishScore(w){
  let s=0;
  if(COMMON.has(w))s+=50;
  if(/^[a-z]+$/.test(w))s+=2;
  if(/[aeiou]/.test(w))s+=3;
  if(!/^[^aeiou]{4,}/.test(w))s+=2;
  if(!/[^aeiou]{4,}$/.test(w))s+=2;
  if(/[q][^u]/.test(w))s-=5;
  return s;
}
function decodePigWord(word){
  const original=word,w=word.toLowerCase();
  if(w.length<3)return word;
  if(w.endsWith("way")||w.endsWith("yay"))return preserveCase(original,w.slice(0,-3));
  if(!w.endsWith("ay"))return word;
  const stem=w.slice(0,-2);
  const guesses=[{word:stem,score:englishScore(stem)}];
  for(const cluster of CLUSTERS){
    if(stem.endsWith(cluster)&&stem.length>cluster.length){
      const guess=cluster+stem.slice(0,-cluster.length);
      guesses.push({word:guess,score:englishScore(guess)+(cluster.length*.5)});
    }
  }
  guesses.sort((a,b)=>b.score-a.score);
  return preserveCase(original,guesses[0].word);
}
function decodePig(text){return mapWords(text,decodePigWord)}
function countMatches(text,re){return(text.toLowerCase().match(re)||[]).length}

function detectMode(text){
  const t=text.toLowerCase();
  const scores={
    ob:countMatches(t,/ob(?=[aeiouy])/g)*4,
    ubbi:countMatches(t,/ub(?=[aeiouy])/g)*4,
    rovar:countMatches(t,/([bcdfghjklmnpqrstvwxyz])o\1/g)*5,
    pig:countMatches(t,/\b[a-z]+(?:ay|way|yay)\b/g)*3,
    normal:1
  };
  const ordered=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return ordered[0][1]>=3?ordered[0][0]:"normal";
}

function decodeCustom(text,lang){
  if(!lang||!lang.rule)return text;
  const r=lang.rule;

  if(r.type==="insertBeforeVowel"){
    const token=escapeRegExp(r.token);
    return mapWords(text,w=>preserveCase(w,w.replace(new RegExp(token+"(?=[aeiouy])","gi"),"")));
  }
  if(r.type==="insertAfterVowel"){
    const token=escapeRegExp(r.token);
    return mapWords(text,w=>preserveCase(w,w.replace(new RegExp("([aeiouy])"+token,"gi"),"$1")));
  }
  if(r.type==="duplicateConsonant"){
    const token=escapeRegExp(r.token);
    return mapWords(text,w=>preserveCase(w,w.replace(new RegExp("([bcdfghjklmnpqrstvwxyz])"+token+"\\1","gi"),"$1")));
  }
  if(r.type==="prefix"){
    const token=escapeRegExp(r.token);
    return mapWords(text,w=>preserveCase(w,w.replace(new RegExp("^"+token,"i"),"")));
  }
  if(r.type==="suffix"){
    const token=escapeRegExp(r.token);
    return mapWords(text,w=>preserveCase(w,w.replace(new RegExp(token+"$","i"),"")));
  }
  return text;
}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

function decode(text,mode){
  if(mode==="ob")return decodeOb(text);
  if(mode==="pig")return decodePig(text);
  if(mode==="ubbi")return decodeUbbi(text);
  if(mode==="rovar")return decodeRovar(text);
  if(mode.startsWith("custom:")){
    const id=mode.split(":")[1];
    const lang=crackedLanguages.find(x=>x.id===id);
    return decodeCustom(text,lang);
  }
  return text;
}

function renderCustomModes(){
  document.querySelectorAll(".custom-mode").forEach(n=>n.remove());
  crackedLanguages.forEach(lang=>{
    const wrap=document.createElement("div");
    wrap.className="custom-mode";
    wrap.innerHTML=`<button class="mode" data-mode="custom:${lang.id}"><b>🔓</b>${escapeHtml(lang.name)}<small>${Math.round(lang.confidence*100)}% confidence</small></button>
                    <button class="delete-mini" title="Delete language" data-delete="${lang.id}">×</button>`;
    modesEl.appendChild(wrap);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function selectMode(mode){
  selectedMode=mode;
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
  crackPanel.classList.toggle("hidden",mode!=="crack");
  customInfoCard.classList.add("hidden");
  addInfoPanel.classList.add("hidden");

  if(mode==="crack"){
    recognitionTarget=crackInput;
    crackInput.focus();
  }else{
    recognitionTarget=input;
  }

  if(mode.startsWith("custom:")){
    showCustomInfo(mode.split(":")[1]);
  }
  if(input.value.trim()&&mode!=="crack")doTranslate();
}

modesEl.addEventListener("click",e=>{
  const del=e.target.closest("[data-delete]");
  if(del){
    e.stopPropagation();
    const id=del.dataset.delete;
    crackedLanguages=crackedLanguages.filter(x=>x.id!==id);
    saveLanguages(crackedLanguages);
    renderCustomModes();
    if(selectedMode===`custom:${id}`)selectMode("auto");
    return;
  }
  const btn=e.target.closest(".mode");
  if(btn)selectMode(btn.dataset.mode);
});

function doTranslate(){
  const text=input.value.trim();
  if(!text){heard.textContent="Nothing yet.";result.textContent="—";pill.textContent="WAITING";return}
  const actual=selectedMode==="auto"?detectMode(text):selectedMode;
  if(actual==="crack")return;
  const translated=decode(text,actual);
  heard.textContent=text;
  result.textContent=translated||"—";
  if(actual.startsWith("custom:")){
    const lang=crackedLanguages.find(x=>x.id===actual.split(":")[1]);
    pill.textContent=(lang?lang.name:"Cracked")+" → ENGLISH";
  }else{
    pill.textContent=(names[actual]||actual)+" → ENGLISH";
  }
}
translateBtn.addEventListener("click",doTranslate);
clearBtn.addEventListener("click",()=>{
  input.value="";heard.textContent="Nothing yet.";result.textContent="—";pill.textContent="WAITING";statusEl.textContent="";
});

function crackLanguage(corpus,previous=null){
  const text=corpus.toLowerCase().replace(/[^a-z\s']/g," ");
  const words=text.split(/\s+/).filter(Boolean);
  if(words.length<2)return null;

  const candidates=[];

  // 1) Repeated insert immediately before vowels: ob, ub, ag, etc.
  const beforeCounts=new Map();
  for(const w of words){
    for(let i=1;i<w.length;i++){
      if(/[aeiouy]/.test(w[i])){
        for(let len=1;len<=3;len++){
          if(i-len>=0){
            const tok=w.slice(i-len,i);
            if(/^[a-z]+$/.test(tok))beforeCounts.set(tok,(beforeCounts.get(tok)||0)+1);
          }
        }
      }
    }
  }
  for(const [token,count] of beforeCounts){
    if(count>=2){
      const transformed=words.map(w=>w.replace(new RegExp(escapeRegExp(token)+"(?=[aeiouy])","g"),""));
      candidates.push(scoreCandidate("insertBeforeVowel",token,count,words,transformed));
    }
  }

  // 2) Repeated insert after vowels.
  const afterCounts=new Map();
  for(const w of words){
    for(let i=0;i<w.length-1;i++){
      if(/[aeiouy]/.test(w[i])){
        for(let len=1;len<=3;len++){
          if(i+1+len<=w.length){
            const tok=w.slice(i+1,i+1+len);
            if(/^[a-z]+$/.test(tok))afterCounts.set(tok,(afterCounts.get(tok)||0)+1);
          }
        }
      }
    }
  }
  for(const [token,count] of afterCounts){
    if(count>=2){
      const transformed=words.map(w=>w.replace(new RegExp("([aeiouy])"+escapeRegExp(token),"g"),"$1"));
      candidates.push(scoreCandidate("insertAfterVowel",token,count,words,transformed));
    }
  }

  // 3) consonant + token + same consonant (Rövarspråket-style)
  const dupCounts=new Map();
  for(const w of words){
    for(let i=0;i<w.length;i++){
      const c=w[i];
      if(!/[bcdfghjklmnpqrstvwxyz]/.test(c))continue;
      for(let len=1;len<=3;len++){
        const j=i+1+len;
        if(j<w.length&&w[j]===c){
          const tok=w.slice(i+1,j);
          if(/^[a-z]+$/.test(tok))dupCounts.set(tok,(dupCounts.get(tok)||0)+1);
        }
      }
    }
  }
  for(const [token,count] of dupCounts){
    if(count>=2){
      const transformed=words.map(w=>w.replace(new RegExp("([bcdfghjklmnpqrstvwxyz])"+escapeRegExp(token)+"\\1","g"),"$1"));
      candidates.push(scoreCandidate("duplicateConsonant",token,count,words,transformed));
    }
  }

  // 4) common prefix/suffix across many words
  for(let len=1;len<=3;len++){
    const pref=new Map(),suf=new Map();
    words.forEach(w=>{
      if(w.length>len+1){
        const p=w.slice(0,len),s=w.slice(-len);
        pref.set(p,(pref.get(p)||0)+1);
        suf.set(s,(suf.get(s)||0)+1);
      }
    });
    for(const [token,count] of pref){
      if(count>=Math.max(3,Math.ceil(words.length*.45))){
        const transformed=words.map(w=>w.startsWith(token)?w.slice(token.length):w);
        candidates.push(scoreCandidate("prefix",token,count,words,transformed));
      }
    }
    for(const [token,count] of suf){
      if(count>=Math.max(3,Math.ceil(words.length*.45))){
        const transformed=words.map(w=>w.endsWith(token)?w.slice(0,-token.length):w);
        candidates.push(scoreCandidate("suffix",token,count,words,transformed));
      }
    }
  }

  if(!candidates.length)return {
    rule:{type:"unknown",token:""},
    confidence:.15,
    explanation:"No strong repeating rule yet",
    preview:text,
    samples:corpus
  };

  // Reward agreement with previous rule as more info comes in, but allow it to change.
  if(previous&&previous.rule){
    candidates.forEach(c=>{
      if(c.rule.type===previous.rule.type&&c.rule.token===previous.rule.token)c.score+=5;
    });
  }

  candidates.sort((a,b)=>b.score-a.score);
  const best=candidates[0];
  return {
    rule:best.rule,
    confidence:Math.max(.25,Math.min(.98,best.confidence)),
    explanation:best.explanation,
    preview:best.preview,
    samples:corpus
  };
}

function scoreCandidate(type,token,count,originalWords,transformedWords){
  let score=count*2;
  let commonHits=0, vowelWords=0, shortened=0;
  transformedWords.forEach((w,i)=>{
    if(COMMON.has(w))commonHits++;
    if(/[aeiou]/.test(w))vowelWords++;
    if(w.length<originalWords[i].length)shortened++;
  });
  score+=commonHits*8+vowelWords*.25+shortened*.15;
  const coverage=count/Math.max(1,originalWords.length);
  let confidence=.25+Math.min(.45,coverage*.22)+Math.min(.25,commonHits/Math.max(1,originalWords.length)*.6);
  const preview=transformedWords.join(" ");

  const explain={
    insertBeforeVowel:`"${token}" appears repeatedly just before vowel sounds. Try removing it before vowels.`,
    insertAfterVowel:`"${token}" appears repeatedly just after vowel sounds. Try removing it after vowels.`,
    duplicateConsonant:`Consonants often appear as consonant + "${token}" + the same consonant. Collapse that pattern.`,
    prefix:`Many words begin with "${token}". Try removing that prefix.`,
    suffix:`Many words end with "${token}". Try removing that suffix.`
  }[type];

  return {rule:{type,token},score,confidence,explanation:explain,preview};
}

function nextLanguageName(){
  let n=1;
  while(crackedLanguages.some(x=>x.name===`Cracked ${n}`))n++;
  return `Cracked ${n}`;
}

crackBtn.addEventListener("click",()=>{
  const sample=crackInput.value.trim();
  if(!sample){statusEl.textContent="Add a few examples first.";return}
  const found=crackLanguage(sample);
  if(!found){statusEl.textContent="I need a little more sample text.";return}

  const lang={
    id:Date.now().toString(36),
    name:nextLanguageName(),
    rule:found.rule,
    confidence:found.confidence,
    explanation:found.explanation,
    samples:sample,
    preview:found.preview
  };
  crackedLanguages.push(lang);
  saveLanguages(crackedLanguages);
  renderCustomModes();
  crackInput.value="";
  statusEl.textContent=`Created ${lang.name}.`;
  selectMode(`custom:${lang.id}`);
});

function ruleLabel(lang){
  if(!lang||!lang.rule)return "Unknown rule";
  const t=lang.rule.type,k=lang.rule.token;
  if(t==="insertBeforeVowel")return `Remove "${k}" before vowels`;
  if(t==="insertAfterVowel")return `Remove "${k}" after vowels`;
  if(t==="duplicateConsonant")return `Collapse consonant + "${k}" + same consonant`;
  if(t==="prefix")return `Remove "${k}" at the start of words`;
  if(t==="suffix")return `Remove "${k}" at the end of words`;
  return "Still learning the pattern";
}

function showCustomInfo(id){
  const lang=crackedLanguages.find(x=>x.id===id);
  if(!lang)return;
  customInfoCard.classList.remove("hidden");
  customRuleTitle.textContent=ruleLabel(lang);
  customConfidence.textContent=`Confidence: ${Math.round(lang.confidence*100)}%`;
  customDetails.textContent=lang.explanation||"Add more examples to improve this language.";
}

addInfoBtn.addEventListener("click",()=>{
  addInfoPanel.classList.toggle("hidden");
  if(!addInfoPanel.classList.contains("hidden"))addInfoInput.focus();
});

improveBtn.addEventListener("click",()=>{
  if(!selectedMode.startsWith("custom:"))return;
  const id=selectedMode.split(":")[1];
  const lang=crackedLanguages.find(x=>x.id===id);
  const extra=addInfoInput.value.trim();
  if(!lang||!extra)return;

  const combined=(lang.samples+" "+extra).trim();
  const improved=crackLanguage(combined,lang);
  lang.samples=combined;
  lang.rule=improved.rule;
  lang.confidence=Math.max(lang.confidence,improved.confidence);
  lang.explanation=improved.explanation;
  lang.preview=improved.preview;

  saveLanguages(crackedLanguages);
  renderCustomModes();
  addInfoInput.value="";
  addInfoPanel.classList.add("hidden");
  selectMode(`custom:${id}`);
  statusEl.textContent="Language updated with the new examples.";
  if(input.value.trim())doTranslate();
});


/* Direct microphone capture for iPad/Safari.
   This does NOT use SpeechRecognition or MediaRecorder.
   It captures raw microphone PCM with Web Audio, then runs Whisper locally in the browser.
*/
let audioContext = null;
let micStream = null;
let micSource = null;
let processor = null;
let silenceGain = null;
let pcmChunks = [];
let recordingSampleRate = 44100;
let transcriber = null;
let transcriberLoading = null;

async function loadTranscriber(){
  if(transcriber) return transcriber;
  if(transcriberLoading) return transcriberLoading;

  statusEl.textContent = "Loading speech model…";

  transcriberLoading = (async()=>{
    // Stable browser build of Transformers.js.
    const mod = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm");

    // Cache downloaded model files in the browser when possible.
    if(mod.env){
      mod.env.allowLocalModels = false;
      mod.env.useBrowserCache = true;
    }

    const pipe = await mod.pipeline(
      "automatic-speech-recognition",
      "Xenova/whisper-tiny.en",
      {
        quantized: true,
        progress_callback: (p)=>{
          if(p && typeof p.progress === "number"){
            statusEl.textContent = "Loading speech model… " + Math.round(p.progress) + "%";
          }
        }
      }
    );

    transcriber = pipe;
    statusEl.textContent = "Speech model ready.";
    return transcriber;
  })();

  try{
    return await transcriberLoading;
  }catch(err){
    transcriberLoading = null;
    throw err;
  }
}

function mergeFloat32(chunks){
  let total = 0;
  for(const c of chunks) total += c.length;
  const out = new Float32Array(total);
  let offset = 0;
  for(const c of chunks){
    out.set(c, offset);
    offset += c.length;
  }
  return out;
}

function resampleLinear(input, fromRate, toRate=16000){
  if(fromRate === toRate) return input;
  if(!input.length) return new Float32Array(0);

  const ratio = fromRate / toRate;
  const outLength = Math.max(1, Math.floor(input.length / ratio));
  const out = new Float32Array(outLength);

  for(let i=0;i<outLength;i++){
    const pos = i * ratio;
    const left = Math.floor(pos);
    const right = Math.min(left + 1, input.length - 1);
    const frac = pos - left;
    out[i] = input[left] * (1-frac) + input[right] * frac;
  }
  return out;
}

function normalizeAudio(audio){
  let peak = 0;
  for(let i=0;i<audio.length;i++){
    const a = Math.abs(audio[i]);
    if(a > peak) peak = a;
  }
  if(peak > 0 && peak < 0.2){
    const gain = Math.min(8, 0.8 / peak);
    for(let i=0;i<audio.length;i++) audio[i] *= gain;
  }
  return audio;
}

async function transcribePCM(audio16k){
  if(audio16k.length < 1600){
    throw new Error("Recording was too short.");
  }

  statusEl.textContent = "Transcribing…";
  const pipe = await loadTranscriber();

  const out = await pipe(audio16k, {
    language: "english",
    task: "transcribe",
    return_timestamps: false
  });

  return String(out && out.text ? out.text : "").trim();
}

async function startRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("Microphone capture is not available in this browser.");
  }

  // Start permission request from the actual button tap.
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false
    },
    video: false
  });

  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) throw new Error("Web Audio is not available.");

  audioContext = new AC();
  if(audioContext.state === "suspended"){
    await audioContext.resume();
  }

  recordingSampleRate = audioContext.sampleRate;
  pcmChunks = [];

  micSource = audioContext.createMediaStreamSource(micStream);

  // ScriptProcessor is deprecated, but remains one of the most compatible
  // ways to capture raw PCM in iPad Safari.
  processor = audioContext.createScriptProcessor(4096, 1, 1);
  silenceGain = audioContext.createGain();
  silenceGain.gain.value = 0;

  processor.onaudioprocess = (event)=>{
    if(!listening) return;
    const channel = event.inputBuffer.getChannelData(0);
    pcmChunks.push(new Float32Array(channel));
  };

  micSource.connect(processor);
  processor.connect(silenceGain);
  silenceGain.connect(audioContext.destination);

  listening = true;
  micarea.classList.add("listening");
  mic.textContent = "■";
  statusEl.textContent = "Recording… tap again to stop.";
}

async function stopRecording(){
  if(!listening) return;
  listening = false;

  micarea.classList.remove("listening");
  mic.textContent = "🎤";
  statusEl.textContent = "Processing recording…";

  try{
    if(processor){
      processor.onaudioprocess = null;
      try{processor.disconnect()}catch{}
    }
    if(micSource){try{micSource.disconnect()}catch{}}
    if(silenceGain){try{silenceGain.disconnect()}catch{}}
    if(micStream){
      micStream.getTracks().forEach(t=>t.stop());
    }

    const merged = mergeFloat32(pcmChunks);
    pcmChunks = [];

    if(audioContext){
      try{await audioContext.close()}catch{}
    }

    processor = null;
    micSource = null;
    silenceGain = null;
    micStream = null;
    audioContext = null;

    if(!merged.length){
      throw new Error("No microphone audio was captured.");
    }

    const audio16k = normalizeAudio(resampleLinear(merged, recordingSampleRate, 16000));
    const transcript = await transcribePCM(audio16k);

    if(!transcript){
      statusEl.textContent = "I couldn't make out any speech. Try again.";
      return;
    }

    recognitionTarget.value = transcript;

    if(recognitionTarget === input){
      heard.textContent = transcript;
      doTranslate();
    }

    statusEl.textContent = "Done.";
  }catch(err){
    console.error("Microphone/transcription error:", err);
    const msg = String(err && (err.message || err) || "");

    if(msg.toLowerCase().includes("failed to fetch") || msg.toLowerCase().includes("load")){
      statusEl.textContent = "The speech model couldn't load. Reload the page and try again.";
    }else if(msg.toLowerCase().includes("memory")){
      statusEl.textContent = "The device ran low on memory. Close other tabs and try again.";
    }else{
      statusEl.textContent = "Could not transcribe. " + (msg || "Try again.");
    }
  }
}

mic.addEventListener("click", async()=>{
  try{
    if(listening){
      await stopRecording();
    }else{
      await startRecording();
    }
  }catch(err){
    console.error("Microphone start error:", err);

    listening = false;
    micarea.classList.remove("listening");
    mic.textContent = "🎤";

    if(micStream){
      try{micStream.getTracks().forEach(t=>t.stop())}catch{}
      micStream = null;
    }
    if(audioContext){
      try{await audioContext.close()}catch{}
      audioContext = null;
    }

    if(err && (err.name === "NotAllowedError" || err.name === "SecurityError")){
      statusEl.textContent = "Microphone access is blocked. Allow microphone access for this site, then try again.";
    }else{
      statusEl.textContent = "Could not start microphone. " + String(err && (err.message || err) || "");
    }
  }
});

input.addEventListener("input",()=>{if(input.value.trim())doTranslate()});


renderCustomModes();
</script>
