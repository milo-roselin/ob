<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Secret Translator FREE</title>
<style>
:root{
  --bg:#07111f;--card:#111e33;--card2:#172842;--text:#fff;--muted:#9db0ca;
  --accent:#57c8ff;--red:#ff5d73;--green:#63e6a3;--line:rgba(255,255,255,.1)
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:linear-gradient(#10203a,#07111f);
  color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:14px
}
.app{width:min(860px,100%);margin:auto}
h1{text-align:center;font-size:clamp(30px,7vw,56px);line-height:1;margin:7px 0}
.version{text-align:center;font-size:11px;color:var(--green);font-weight:800;letter-spacing:.08em}
.sub{text-align:center;color:var(--muted);margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:13px}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{min-height:66px;background:var(--card2);border:1px solid var(--line);border-radius:15px;color:#fff;font-weight:800;font-size:14px}
.mode.active{border-color:var(--accent);background:rgba(87,200,255,.13)}
.mode b{display:block;font-size:22px}
.micarea{text-align:center}
.micwrap{width:150px;height:150px;margin:auto;display:grid;place-items:center;position:relative}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(87,200,255,.2)}
.mic{position:relative;z-index:2;width:104px;height:104px;border:0;border-radius:50%;font-size:42px;background:var(--accent)}
.listening .mic{background:var(--red);color:#fff}
.listening .ring{border-color:var(--red);animation:pulse 1.1s infinite}
@keyframes pulse{to{transform:scale(1.25);opacity:0}}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:21px;margin-top:4px}
.good{color:var(--green)} .error{color:#ffb7c1}
textarea{
  width:100%;min-height:95px;background:#0b1729;color:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px;font:inherit;font-size:17px
}
.btn{
  width:100%;min-height:48px;border:0;border-radius:13px;background:var(--accent);
  font-weight:850;font-size:16px;margin-top:9px
}
.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}
.result{font-weight:900;font-size:clamp(25px,6vw,42px);line-height:1.2;overflow-wrap:anywhere}
.heard{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
.pill{display:inline-block;background:rgba(87,200,255,.1);color:#bfeaff;border:1px solid rgba(87,200,255,.2);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:8px}
.note{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none!important}
@media(max-width:360px),(max-height:420px) and (max-width:500px){
  body{padding:6px}
  h1{font-size:21px;margin:3px 0}
  .version{font-size:8px}
  .sub{display:none}
  .card{border-radius:14px;padding:8px;margin-bottom:6px}
  .label{font-size:9px;margin-bottom:5px}
  .modes{grid-template-columns:repeat(2,1fr);gap:4px}
  .mode{min-height:42px;font-size:10px;border-radius:10px;padding:3px}
  .mode b{font-size:15px}
  .micwrap{width:86px;height:86px}
  .mic{width:60px;height:60px;font-size:25px}
  .status{font-size:10px;line-height:1.2}
  textarea{min-height:58px;font-size:13px;padding:7px}
  .btn{min-height:38px;font-size:12px;margin-top:5px}
  .result{font-size:19px}
  .heard{font-size:11px}
  .pill{font-size:8px;padding:3px 6px}
  .note{font-size:10px}
  .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="app">
  <h1>Secret Translator</h1>
  <div class="sub">Custom decoder for Ob, Pig Latin, Ubbi Dubbi, Rövarspråket, and normal English.</div>

  <section class="card">
    <div class="label">Language</div>
    <div class="modes">
      <button class="mode active" data-mode="auto"><b>✨</b>Auto</button>
      <button class="mode" data-mode="ob"><b>🅾️</b>Ob</button>
      <button class="mode" data-mode="pig"><b>🐷</b>Pig Latin</button>
      <button class="mode" data-mode="ubbi"><b>🔵</b>Ubbi</button>
      <button class="mode" data-mode="rovar"><b>🕵️</b>Rövar</button>
      <button class="mode" data-mode="normal"><b>💬</b>Normal</button>
    </div>
  </section>

  <section class="card micarea" id="micarea">
    <div class="micwrap"><div class="ring"></div><button class="mic" id="mic">🎤</button></div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <div class="label">Type or use device dictation</div>
    <textarea id="input" placeholder="Speak with browser recognition, or tap here and use your iPhone/iPad/watch dictation keyboard"></textarea>
    <div class="row">
      <button class="btn" id="translate">Translate</button>
      <button class="btn secondary" id="clear">Clear</button>
    </div>
  </section>

  <section class="card">
    <div class="pill" id="pill">WAITING</div>
    <div class="label">English translation</div>
    <div class="result" id="result">—</div>
  </section>

  <section class="card">
    <div class="label">What it heard / what you entered</div>
    <div class="heard" id="heard">Nothing yet.</div>
  </section>

</main>

<script>
const input=document.getElementById("input");
const result=document.getElementById("result");
const heard=document.getElementById("heard");
const statusEl=document.getElementById("status");
const pill=document.getElementById("pill");
const mic=document.getElementById("mic");
const micarea=document.getElementById("micarea");
const translateBtn=document.getElementById("translate");
const clearBtn=document.getElementById("clear");
const modeButtons=[...document.querySelectorAll(".mode")];

let selectedMode="auto";
let recognition=null;
let listening=false;

const names={
  auto:"Auto",ob:"Ob",pig:"Pig Latin",ubbi:"Ubbi Dubbi",rovar:"Rövarspråket",normal:"Normal"
};

modeButtons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedMode=btn.dataset.mode;
    modeButtons.forEach(b=>b.classList.toggle("active",b===btn));
    if(input.value.trim()) doTranslate();
  });
});

function preserveCase(original,replacement){
  if(!original)return replacement;
  if(original===original.toUpperCase())return replacement.toUpperCase();
  if(original[0]===original[0].toUpperCase())return replacement[0].toUpperCase()+replacement.slice(1).toLowerCase();
  return replacement.toLowerCase();
}

function mapWords(text,fn){
  return text.replace(/[A-Za-zÀ-ÖØ-öø-ÿ']+/g,fn);
}

function decodeOb(text){
  return mapWords(text,w=>{
    // Main Ob rule: remove ob immediately before a vowel.
    let d=w.replace(/ob(?=[aeiouy])/gi,"");
    // Some people pronounce repeated "ob" slightly differently; collapse obvious leftovers.
    d=d.replace(/([aeiou])ob(?=$|[^aeiou])/gi,"$1");
    return preserveCase(w,d);
  });
}

function decodeUbbi(text){
  return mapWords(text,w=>{
    let d=w.replace(/ub(?=[aeiouy])/gi,"");
    return preserveCase(w,d);
  });
}

function decodeRovar(text){
  return mapWords(text,w=>{
    const d=w.toLowerCase().replace(/([bcdfghjklmnpqrstvwxyz])o\1/gi,"$1");
    return preserveCase(w,d);
  });
}

const COMMON=new Set([
"a","i","about","after","again","all","am","and","are","as","at","away","back","be","because","been","before",
"big","but","by","call","came","can","come","could","day","did","do","does","dog","down","eat","english","even",
"find","fish","for","friend","from","game","get","give","go","going","good","got","had","has","have","he","hello",
"help","her","here","him","his","home","house","how","i","if","in","into","is","it","just","know","language","like",
"little","look","made","make","me","more","morning","my","night","no","not","now","of","on","one","or","our","out",
"pig","play","please","really","said","say","school","secret","see","she","so","some","something","take","tell","thank",
"that","the","their","them","then","there","they","think","this","time","to","today","tomorrow","up","us","very","want",
"was","water","way","we","well","were","what","when","where","which","who","why","will","with","would","yes","you","your"
]);

const CLUSTERS=[
"str","spr","scr","spl","shr","thr","sch","squ","ch","sh","th","ph","wh","qu",
"tr","dr","br","cr","fr","gr","pr","bl","cl","fl","gl","pl","sl","sk","sm","sn","sp","st","sw",
"b","c","d","f","g","h","j","k","l","m","n","p","q","r","s","t","v","w","x","y","z"
];

function englishScore(w){
  let s=0;
  if(COMMON.has(w))s+=50;
  if(/^[a-z]+$/.test(w))s+=2;
  if(/[aeiou]/.test(w))s+=3;
  if(!/^[^aeiou]{4,}/.test(w))s+=2;
  if(!/[^aeiou]{4,}$/.test(w))s+=2;
  if(/[q][^u]/.test(w))s-=5;
  return s;
}

function decodePigWord(word){
  const original=word;
  const w=word.toLowerCase();

  if(w.length<3)return word;

  if(w.endsWith("way")){
    const base=w.slice(0,-3);
    return preserveCase(original,base);
  }
  if(w.endsWith("yay")){
    const base=w.slice(0,-3);
    return preserveCase(original,base);
  }
  if(!w.endsWith("ay"))return word;

  const stem=w.slice(0,-2);
  const guesses=[{word:stem,score:englishScore(stem)}];

  for(const cluster of CLUSTERS){
    if(stem.endsWith(cluster) && stem.length>cluster.length){
      const guess=cluster+stem.slice(0,-cluster.length);
      guesses.push({
        word:guess,
        score:englishScore(guess)+(cluster.length*0.5)
      });
    }
  }

  guesses.sort((a,b)=>b.score-a.score);
  return preserveCase(original,guesses[0].word);
}

function decodePig(text){
  return mapWords(text,decodePigWord);
}

function countMatches(text,re){
  return (text.toLowerCase().match(re)||[]).length;
}

function detectMode(text){
  const t=text.toLowerCase();
  const scores={
    ob: countMatches(t,/ob(?=[aeiouy])/g)*4,
    ubbi: countMatches(t,/ub(?=[aeiouy])/g)*4,
    rovar: countMatches(t,/([bcdfghjklmnpqrstvwxyz])o\1/g)*5,
    pig: countMatches(t,/\b[a-z]+(?:ay|way|yay)\b/g)*3,
    normal:1
  };
  const ordered=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  return ordered[0][1]>=3 ? ordered[0][0] : "normal";
}

function decode(text,mode){
  if(mode==="ob")return decodeOb(text);
  if(mode==="pig")return decodePig(text);
  if(mode==="ubbi")return decodeUbbi(text);
  if(mode==="rovar")return decodeRovar(text);
  return text;
}

function doTranslate(){
  const text=input.value.trim();
  if(!text){
    heard.textContent="Nothing yet.";
    result.textContent="—";
    pill.textContent="WAITING";
    return;
  }

  const actual=selectedMode==="auto"?detectMode(text):selectedMode;
  const translated=decode(text,actual);

  heard.textContent=text;
  result.textContent=translated || "—";
  pill.textContent=(names[actual]||actual)+" → ENGLISH";
}

translateBtn.addEventListener("click",doTranslate);

clearBtn.addEventListener("click",()=>{
  input.value="";
  heard.textContent="Nothing yet.";
  result.textContent="—";
  pill.textContent="WAITING";
  statusEl.textContent="Ready.";
});

function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    statusEl.textContent="This browser blocks free web speech. Use the text box with device dictation.";
    return null;
  }

  const r=new SR();
  r.lang="en-US";
  r.interimResults=true;
  r.continuous=false;
  r.maxAlternatives=5;

  r.onstart=()=>{
    listening=true;
    micarea.classList.add("listening");
    mic.textContent="■";
    statusEl.textContent="Listening…";
  };

  r.onresult=e=>{
    let finalText="";
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const chunk=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalText+=chunk;
      else interim+=chunk;
    }
    const combined=(finalText||interim).trim();
    if(combined){
      input.value=combined;
      heard.textContent=combined;
      doTranslate();
    }
  };

  r.onerror=e=>{
    listening=false;
    micarea.classList.remove("listening");
    mic.textContent="🎤";

    if(e.error==="service-not-allowed"||e.error==="not-allowed"){
      statusEl.textContent="Free browser speech is blocked here. Tap the text box and use device dictation instead.";
    }else{
      statusEl.textContent="Speech recognition error: "+e.error+". You can still use device dictation.";
    }
  };

  r.onend=()=>{
    listening=false;
    micarea.classList.remove("listening");
    mic.textContent="🎤";
    if(input.value.trim()){
      statusEl.textContent="Finished.";
      doTranslate();
    }
  };

  return r;
}

recognition=setupRecognition();

mic.addEventListener("click",()=>{
  if(!recognition){
    input.focus();
    statusEl.textContent="Use your device's dictation microphone in the keyboard.";
    return;
  }

  try{
    if(listening){
      recognition.stop();
    }else{
      recognition.start();
    }
  }catch{
    statusEl.textContent="Could not start free browser speech. Use device dictation instead.";
    input.focus();
  }
});

input.addEventListener("input",()=>{
  if(input.value.trim())doTranslate();
});
</script>
</body>
</html>
